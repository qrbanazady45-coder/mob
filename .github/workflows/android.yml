name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    # این بخش بسیار حیاتی است: تمام دستورات در پوشه app اجرا می‌شوند
    defaults:
      run:
        working-directory: ./app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # این مرحله برای عیب‌یابی اضافه شده است؛ اگر بیلد شکست خورد، 
      # در لاگ‌ها ببینید که فایل‌ها دقیقاً در چه مسیری هستند.
      - name: List files for debugging
        run: |
          echo "--- Root Directory Content ---"
          ls -F
          echo "--- App Directory Content ---"
          ls -F app/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug --no-daemon --stacktrace
