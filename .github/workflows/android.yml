name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # ۱. مجوز اجرا را به فایل gradlew در ریشه می‌دهیم
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ۲. دستور بیلد را اجرا می‌کنیم
      # نکته مهم: working-directory روی ./app تنظیم شده 
      # و از ../gradlew استفاده کردیم تا از فایل اصلی در ریشه استفاده شود
      - name: Build with Gradle
        working-directory: ./app
        run: ../gradlew assembleDebug
