name: Android CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # این دستور به فایل gradlew اجازه اجرا شدن می‌دهد
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # حالا که اجازه دارد، آن را اجرا می‌کنیم
      - name: Build with Gradle
        run: ./gradlew assembleDebug
