name: Android CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # ۱. استفاده از setup-gradle با غیرفعال کردن کامل کش
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      # ۲. حذف کامل فایل‌های خراب و بازسازی استاندارد
      - name: Fix and Prepare Wrapper
        run: |
          rm -rf gradle/wrapper/gradle-wrapper.jar
          ./gradlew wrapper --gradle-version 8.7 --warning-mode all
          chmod +x gradlew

      # ۳. اجرای بیلد نهایی
      - name: Build with Gradle
        run: ./gradlew assembleDebug
