name: Android CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ۱. چک کردن اینکه آیا فایل‌های گریدل سر جایشان هستند یا نه
      - name: Debug Directory Structure
        run: |
          echo "--- Root directory contents ---"
          ls -la
          echo "--- Gradle wrapper contents ---"
          ls -la gradle/wrapper/ || echo "Folder 'gradle/wrapper/' not found!"

      # ۲. چک کردن اینکه جاوا نصب است یا نه
      - name: Check Java
        run: java -version

      # ۳. دادن اجازه اجرا
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ۴. تلاش برای اجرای گریدل (این بار با نسخه چک)
      - name: Build with Gradle
        run: ./gradlew --version && ./gradlew assembleDebug
