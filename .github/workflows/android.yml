name: Android CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Build with Gradle
        run: ./gradlew assembleDebug

      # این مرحله حیاتی است: اگر APK پیدا نشد، لیست تمام فایل‌های ساخته شده را به ما نشان می‌دهد
      - name: Debug - List all files
        run: find . -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-android-app
          path: "**/*.apk"
