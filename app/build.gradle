plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // تغییر مهم: استفاده از پلاگین KSP به جای KAPT (توصیه گوگل برای کارایی بهتر و پایداری)
    id 'com.google.devtools.ksp' version '1.9.20-1.0.14'
}

android {
    namespace "com.example.smsbackup"
    compileSdk 34

    defaultConfig {
        applicationId "com.example.smsbackup"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.room:room-runtime:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"
    
    // جایگزینی کِپت با کِی‌اس‌پی (KSP) که در پلاگین بالا اضافه شد
    ksp "androidx.room:room-compiler:2.6.1"
    
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
}
